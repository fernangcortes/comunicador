# Comunicador — central na Cloudflare (Worker + Durable Object)
name = "comunicador"
main = "src/index.js"
compatibility_date = "2025-02-24"

# Opcional: link para baixar o app, mostrado na página de convite.
[vars]
APP_URL = "https://github.com/fernangcortes/comunicador/releases/latest/download/comunicador.apk"

# Imagens da marca, embutidas no Worker
[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = true

[[durable_objects.bindings]]
name = "CANAL"
class_name = "Canal"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Canal"]
