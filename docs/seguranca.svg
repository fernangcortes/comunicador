<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="Segurança: a senha do canal fica no celular e gera uma prova de entrada e uma chave da voz; a central confere a prova e repassa a voz cifrada sem conseguir ouvir">
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #eef1f3; }
    .t { font-size: 22px; font-weight: 800; }
    .b { font-size: 15px; font-weight: 700; }
    .s { font-size: 12.5px; fill: #a3abb3; }
    .a { fill: #f2a516; }
    .box { fill: #2d3238; stroke: #3e454d; stroke-width: 1.5; }
    .key { fill: #2d3238; stroke: #f2a516; stroke-width: 2; }
    .cen { fill: #2d3238; stroke: #e5323f; stroke-width: 2; }
    .ln { stroke: #a3abb3; stroke-width: 2; fill: none; }
    .lock { stroke: #f2a516; stroke-width: 2.5; fill: none; }
  </style>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a3abb3"/>
    </marker>
    <g id="cadeado"><rect x="-8" y="-2" width="16" height="12" rx="2" fill="#f2a516"/><path d="M-5,-2 v-4 a5,5 0 0 1 10,0 v4" class="lock"/></g>
  </defs>
  <rect width="800" height="400" rx="18" fill="#22262b"/>
  <text x="32" y="46" class="t">Senha do canal e voz cifrada</text>
  <text x="32" y="70" class="s">A senha vai escondida no convite e nunca sai do celular. A central confere quem entra, mas não ouve a conversa.</text>

  <!-- derivação -->
  <rect x="32" y="96" width="210" height="64" rx="10" class="key"/>
  <text x="137" y="124" text-anchor="middle" class="b">Senha do canal</text>
  <text x="137" y="144" text-anchor="middle" class="s">só nos celulares</text>
  <path d="M242,128 L296,128" class="ln" marker-end="url(#seta)"/>
  <text x="269" y="90" text-anchor="middle" class="s">PBKDF2</text>
  <rect x="300" y="96" width="210" height="64" rx="10" class="box"/>
  <text x="405" y="124" text-anchor="middle" class="b">Prova de entrada</text>
  <text x="405" y="144" text-anchor="middle" class="s">vai no pedido para entrar</text>
  <rect x="558" y="96" width="210" height="64" rx="10" class="box"/>
  <text x="663" y="124" text-anchor="middle" class="b">Chave da voz</text>
  <text x="663" y="144" text-anchor="middle" class="s">AES-256-GCM</text>
  <path d="M269,140 C269,180 520,180 600,162" class="ln" marker-end="url(#seta)"/>

  <!-- fluxo da voz -->
  <rect x="32" y="232" width="190" height="72" rx="10" class="box"/>
  <text x="127" y="262" text-anchor="middle" class="b">Quem fala</text>
  <text x="127" y="282" text-anchor="middle" class="s">cifra cada pacote de 20 ms</text>
  <path d="M222,268 L304,268" class="ln" marker-end="url(#seta)"/>
  <use href="#cadeado" x="263" y="250"/>
  <rect x="308" y="226" width="184" height="84" rx="10" class="cen"/>
  <text x="400" y="256" text-anchor="middle" class="b">Central</text>
  <text x="400" y="276" text-anchor="middle" class="s">confere a prova de entrada</text>
  <text x="400" y="294" text-anchor="middle" class="s">e só repassa a voz</text>
  <path d="M492,268 L574,268" class="ln" marker-end="url(#seta)"/>
  <use href="#cadeado" x="533" y="250"/>
  <rect x="578" y="232" width="190" height="72" rx="10" class="box"/>
  <text x="673" y="262" text-anchor="middle" class="b">Quem ouve</text>
  <text x="673" y="282" text-anchor="middle" class="s">decifra e toca</text>

  <text x="32" y="346" class="s"><tspan class="a">Sem a senha</tspan>, ninguém entra nem ouve. Pacote alterado no caminho é descartado. Cifrar leva microssegundos: não atrasa o som.</text>
  <text x="32" y="368" class="s"><tspan class="a">Código de administrador</tspan>: com ele configurado na central, só a produção cria canais; quem chega por convite não precisa dele.</text>
  <text x="32" y="390" class="s">No WebRTC, a voz já vai cifrada pelo próprio WebRTC até o Cloudflare Realtime.</text>
</svg>
